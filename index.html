<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barrie Nissan · Customer Hub</title>
  <meta name="description" content="Everything a Barrie Nissan customer needs in one place: hours, service booking, parts, financing, owner resources and who to call.">
  <meta name="theme-color" content="#0f0f10">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ===== LANGUAGE BAR (always visible, first thing on the page) ===== -->
  <div class="langbar" id="langbar" role="navigation" aria-label="Language">
    <div class="container langbar__inner">
      <span class="langbar__prompt"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg><span id="langPrompt">Read this page in your language</span></span>
      <div class="langbar__buttons" id="langButtons"></div>
    </div>
  </div>

  <!-- ===== HEADER ===== -->
  <header class="hero">
    <div class="container">
      <div class="hero__top">
        <a class="hero__logo" id="logoLink" href="#"><img id="logoImg" src="" alt=""></a>
        <span class="status" id="status"><span class="status__dot"></span><span id="statusText">Checking hours…</span></span>
      </div>
      <p class="hero__slogan" id="slogan"></p>
      <h1 class="hero__title"><span id="dealerName"></span> <span class="hero__title-light" id="hubTitle"></span></h1>
      <p class="hero__tagline" id="tagline"></p>
      <div class="hero__cta" id="heroCta"></div>
      <div class="hero__vcard" id="vcardWrap" hidden>
        <a class="btn btn--vcard" id="vcardBtn" href="#" download="">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h10l6 6v10a2 2 0 0 1-2 2z"/><path d="M12 11v6M9 14l3 3 3-3"/></svg>
          <span id="vcardLabel"></span>
        </a>
        <span class="hero__vcard-hint" id="vcardHint"></span>
      </div>
    </div>
  </header>

  <main>
    <!-- ===== QUICK ACTIONS ===== -->
    <section class="section" id="quick">
      <div class="container">
        <h2 class="section__title"><span id="quickTitle"></span> <span class="title-accent" id="quickAccent"></span></h2>
        <div class="tiles" id="quickActions"></div>
      </div>
    </section>

    <!-- ===== SERVICE SPECIALS / COUPONS ===== -->
    <section class="section section--alt" id="specials" hidden>
      <div class="container">
        <p class="eyebrow" id="specialsEyebrow"></p>
        <h2 class="section__title" id="specialsTitle"></h2>
        <p class="section__intro" id="specialsIntro"></p>
        <h3 class="coupons__group" id="specialsServiceTitle"></h3>
        <div class="coupons" id="couponListService"></div>
        <h3 class="coupons__group" id="specialsPartsTitle"></h3>
        <div class="coupons" id="couponListParts"></div>
      </div>
    </section>

    <!-- ===== REVIEWS ===== -->
    <section class="section" id="reviews" hidden>
      <div class="container">
        <div class="reviews">
          <div class="reviews__intro">
            <p class="eyebrow" id="reviewsEyebrow"></p>
            <h2 class="section__title" id="reviewsTitle"></h2>
            <p class="reviews__text" id="reviewsText"></p>
            <div class="reviews__stars" aria-hidden="true">★★★★★</div>
          </div>
          <div class="reviews__actions">
            <div class="platforms" id="reviewPlatforms"></div>
            <a class="btn btn--unhappy" id="unhappyBtn" href="#">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H7l-3 3z"/><path d="M8 9h8M8 12h5"/></svg>
              <span id="unhappyLabel"></span>
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== HOURS & LOCATION ===== -->
    <section class="section section--alt" id="hours">
      <div class="container grid-2">
        <div>
          <h2 class="section__title" id="hoursTitle"></h2>
          <div class="hours" id="hoursTable"></div>
        </div>
        <div>
          <h2 class="section__title" id="findUs"></h2>
          <div class="card card--location">
            <p class="card__big" id="addressLine"></p>
            <p class="card__muted" id="addressCity"></p>
            <div class="btn-row">
              <a class="btn btn--dark" id="mapsBtn" href="#" target="_blank" rel="noopener"></a>
              <a class="btn btn--ghost" id="callBtn" href="#"></a>
            </div>
            <p class="card__small" id="tollFree"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== ALL BRANDS WELCOME ===== -->
    <section class="section" id="allbrands">
      <div class="container">
        <div class="banner">
          <div class="banner__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l2-5a2 2 0 0 1 1.9-1.4h10.2A2 2 0 0 1 19 8l2 5"/><rect x="2.5" y="13" width="19" height="6" rx="1.5"/><circle cx="7" cy="16" r="1"/><circle cx="17" cy="16" r="1"/></svg>
          </div>
          <div>
            <h2 class="banner__title" id="allBrandsTitle"></h2>
            <p id="allBrandsText"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== HIGH MILEAGE CLUB ===== -->
    <section class="section section--dark" id="hmc" hidden>
      <div class="container grid-2 grid-2--center">
        <div>
          <p class="eyebrow" id="loyaltyEyebrow"></p>
          <h2 class="section__title section__title--light" id="hmcTitle"></h2>
          <p class="lead" id="hmcText"></p>
          <a class="btn btn--red" id="hmcCta" href="#" target="_blank" rel="noopener"></a>
          <p class="fineprint" id="hmcFine"></p>
        </div>
        <ul class="perks" id="hmcBullets"></ul>
      </div>
    </section>

    <!-- ===== EVERYDAY VALUE ===== -->
    <section class="section" id="value" hidden>
      <div class="container">
        <p class="eyebrow" id="valueEyebrow"></p>
        <h2 class="section__title" id="valueTitle"></h2>
        <p class="section__intro" id="valueText"></p>
        <div class="values" id="valueList"></div>
      </div>
    </section>

    <!-- ===== SERVICE VISIT ===== -->
    <section class="section section--alt" id="service-visit">
      <div class="container">
        <p class="eyebrow" id="serviceEyebrow"></p>
        <h2 class="section__title" id="serviceTitle"></h2>
        <p class="section__intro" id="serviceIntro"></p>
        <ol class="steps" id="serviceSteps"></ol>
      </div>
    </section>

    <!-- ===== AFTER PURCHASE ===== -->
    <section class="section" id="after-purchase">
      <div class="container">
        <p class="eyebrow" id="salesEyebrow"></p>
        <h2 class="section__title" id="salesTitle"></h2>
        <ol class="steps steps--compact" id="purchaseSteps"></ol>
      </div>
    </section>

    <!-- ===== WHO TO ASK FOR ===== -->
    <section class="section section--alt" id="team">
      <div class="container">
        <p class="eyebrow" id="teamEyebrow"></p>
        <h2 class="section__title" id="teamTitle"></h2>
        <p class="section__intro" id="teamIntro"></p>
        <div class="team" id="teamList"></div>
      </div>
    </section>

    <!-- ===== LINKS ===== -->
    <section class="section" id="links">
      <div class="container">
        <h2 class="section__title" id="linksTitle"></h2>
        <div class="linkgroups" id="linkGroups"></div>
      </div>
    </section>

    <!-- ===== FAQ ===== -->
    <section class="section section--alt" id="faq">
      <div class="container container--narrow">
        <h2 class="section__title" id="faqTitle"></h2>
        <div class="faq" id="faqList"></div>
      </div>
    </section>

    <!-- ===== ESCALATION ===== -->
    <section class="section section--red" id="help">
      <div class="container">
        <p class="eyebrow eyebrow--light" id="helpEyebrow"></p>
        <h2 class="section__title section__title--light" id="helpTitle"></h2>
        <p class="lead lead--light" id="helpText"></p>
        <div class="contacts" id="escalation"></div>
        <div class="btn-row btn-row--center" id="reviewRow"></div>
      </div>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__social" id="social"></div>
      <div class="footer__langs" id="footerLangs"></div>
      <p class="footer__text"><span id="footerName"></span> · <a id="footerSite" href="#" target="_blank" rel="noopener"></a> · <a id="privacyLink" href="#" target="_blank" rel="noopener"></a></p>
      <p class="footer__text footer__text--tiny">© <span id="year"></span> <span id="footerName2"></span>. <span id="rights"></span></p>
      <p class="footer__text footer__text--tiny footer__publisher" id="publisher"></p>
    </div>
  </footer>

  <div class="stickybar" id="stickybar"></div>

  <script src="js/dealer-config.js"></script>
  <script src="js/lang/en.js"></script>
  <script src="js/lang/uk.js"></script>
  <script src="js/lang/fr.js"></script>
  <script src="js/lang/es.js"></script>
  <script src="js/lang/pt.js"></script>
  <script src="js/lang/tl.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
